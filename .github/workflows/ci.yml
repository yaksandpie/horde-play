name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # esbuild is the only build dependency, and the app has no runtime ones.
      - name: Install the build
        run: npm ci

      # Catches an unresolved import or a syntax error in any module, and is
      # also what proves the page can still be assembled at all.
      - name: Build the site
        run: node build.mjs

      # The checks the build can't make: that what landed in _site parses,
      # that the manifest is valid, and that every file the page and the
      # service worker reference is really there.
      - name: Check the built site
        run: node tests/check-static.mjs

  cache-version:
    name: Service worker cache version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install the build
        run: npm ci

      # Nobody bumps CACHE_VERSION by hand any more — the build hashes the
      # shell's own bytes. This checks that derivation is really wired up, by
      # perturbing the shell and watching the version move.
      - name: Prove the cache version tracks the app shell
        run: node tests/check-cache-version.mjs

  test:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/package-lock.json

      - name: Install the build
        run: npm ci

      - name: Install test tooling
        working-directory: tests
        run: npm ci

      # The browser build is the biggest thing this job does — a fresh download
      # every run, for a binary pinned by the lockfile. Key on the lockfile, so
      # a Playwright bump fetches a new one and nothing else does.
      #
      # A hit restores the browser and runs nothing else: the ubuntu-latest
      # image already carries the shared libraries Chromium links against, so
      # install-deps costs 13s to install what is there. That is an assumption
      # about the runner image rather than a declared dependency, and it fails
      # loudly if it stops holding — the browser won't launch and every test
      # errors, which is the miss path's --with-deps to put back.
      - name: Cache the browser build
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('tests/package-lock.json') }}

      - name: Install Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        working-directory: tests
        run: npx playwright install --with-deps chromium

      # The Playwright config builds _site before serving it, so the suite
      # always runs against freshly assembled output.
      #
      # Scryfall is stubbed out in the tests, so this runs without touching
      # the network — and without hammering a free public API on every push.
      - name: Run the tests
        working-directory: tests
        run: npx playwright test

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 7
