name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-flight one finish rather than shipping
# a half-uploaded site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install the build
        run: npm ci

      # _site is exactly the app: the page with its styles and script inlined,
      # the manifest, the icons, and a service worker whose cache version is a
      # hash of those bytes. Nothing filters tooling out any more, because no
      # tooling is in there to begin with.
      - name: Build the site
        run: node build.mjs

      # Same gate as CI: never publish a page whose script doesn't parse.
      - name: Check the built site
        run: node tests/check-static.mjs

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
